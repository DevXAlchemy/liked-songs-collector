services:
  backend:
    build: ./liked-songs-backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - ./liked-songs-backend/.env

  frontend:
    build: ./liked-songs-app
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: "redis:alpine"
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
    driver: local
